name: Validate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Fail immediately when any step exits non-zero. Do not add continue-on-error.
jobs:
  validate:
    name: Lint, test, validate, smoke, artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff
        run: python -m ruff check src scripts tests

      - name: Pytest
        env:
          MPLCONFIGDIR: ${{ github.workspace }}/.mplconfig
        run: |
          mkdir -p "$MPLCONFIGDIR"
          python -m pytest tests/ -q

      - name: Prepare CI fixtures
        run: python scripts/prepare_ci_fixtures.py --config config/ci.yaml

      - name: Dataset Validation
        run: python scripts/validate_dataset.py --config config/ci.yaml --allow-missing-audio

      - name: Feature Validation
        run: python scripts/validate_features.py --config config/ci.yaml

      - name: Split Validation
        run: python scripts/validate_splits.py --config config/ci.yaml --seed 42

      - name: Smoke Test
        env:
          MPLCONFIGDIR: ${{ github.workspace }}/.mplconfig
        run: |
          mkdir -p "$MPLCONFIGDIR"
          python scripts/smoke_test.py --config config/ci.yaml

      - name: Artifact Validation
        run: python scripts/check_artifacts.py --config config/ci.yaml --require-manifest
