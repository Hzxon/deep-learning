name: testgate

on:
  pull_request:

# Least privilege for GITHUB_TOKEN: the gate only reads the repo.
permissions:
  contents: read

jobs:
  testgate:
    runs-on: ubuntu-latest
    # Secrets live in the `testgate` environment, which needs a reviewer's
    # approval per run. A PR that edits this file cannot read them unapproved.
    environment: testgate
    env:
      # secrets cannot be used in step-level `if`, so expose one through env
      HIDDEN_REPO: ${{ secrets.TESTGATE_HIDDEN_REPO }}
    steps:
      # Actions are pinned to full commit SHAs so a moved tag cannot change CI.
      # persist-credentials: false keeps tokens and keys off disk, where the
      # tests under judgement could read them.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # The hidden tests live in a private repository the PR author cannot read.
      # Give CI a read-only deploy key for it: `ssh-keygen -t ed25519 -f key`,
      # add key.pub as a deploy key on that repo, store key in the secret
      # TESTGATE_HIDDEN_SSH_KEY, and set TESTGATE_HIDDEN_REPO to owner/name.
      - name: Check out hidden tests
        if: env.HIDDEN_REPO != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
          repository: ${{ env.HIDDEN_REPO }}
          ref: main  # set explicitly: resolving the default branch needs API access the token lacks
          ssh-key: ${{ secrets.TESTGATE_HIDDEN_SSH_KEY }}
          path: .testgate-hidden

      # The sandbox runs tests with the interpreter that runs testgate, so the
      # project's dependencies must be installed into the same Python 3.12 the
      # action sets up. CPU-only torch keeps the install small.
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      # testgate lives in the private repo Hzxon/test-entity, which a public repo
      # cannot reference with `uses:`. Check it out with a read-only deploy key
      # (secret TESTGATE_ACTION_SSH_KEY) and run it as a local action.
      - name: Check out testgate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
          repository: Hzxon/test-entity
          ref: 459af3e9832e822d45282beb3da18ec982f501f2  # origin/main 2026-10-24 (#44); tag v0 lacks gates.coverage.max_drop
          ssh-key: ${{ secrets.TESTGATE_ACTION_SSH_KEY }}
          path: .testgate-action

      - name: Run testgate
        uses: ./.testgate-action
        with:
          base: origin/${{ github.base_ref }}
          hidden-dir: ${{ github.workspace }}/.testgate-hidden
        env:
          TESTGATE_SEED: ${{ secrets.TESTGATE_SEED }}
