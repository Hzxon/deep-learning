name: Nightly Audit

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-audit-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  nightly-audit:
    name: Validation-only nightly audit
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare CI fixtures
        run: python scripts/prepare_ci_fixtures.py --config config/ci.yaml

      - name: Dataset Validation
        run: python scripts/validate_dataset.py --config config/ci.yaml --allow-missing-audio

      - name: Feature Validation
        run: python scripts/validate_features.py --config config/ci.yaml

      - name: Split Validation
        run: python scripts/validate_splits.py --config config/ci.yaml --seed 42

      - name: Reproducibility Check
        run: python scripts/reproducibility_check.py --config config/ci.yaml --seed 42

      - name: Artifact Validation
        run: python scripts/check_artifacts.py --config config/ci.yaml --require-manifest

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-audit-reports
          path: |
            VALIDATION_REPORT.md
            artifacts/reports/
            PRE_TRAINING_AUDIT.md
          if-no-files-found: warn
