# CI-only config. Points at synthetic fixtures generated by scripts/prepare_ci_fixtures.py.
# Never use this config for thesis experiments.

seed: 42

labels:
  - angry
  - disgust
  - fear
  - happy
  - neutral
  - sad

sample_rate: 16000
duration_seconds: 3.0

mel:
  n_fft: 512
  win_length: 512
  hop_length: 256
  n_mels: 64
  fmin: 20
  fmax: 8000
  power: 2.0
  target_frames: 188

train:
  batch_size: 16
  num_workers: 0
  max_epochs: 1
  patience: 1
  learning_rate: 0.001
  weight_decay: 0.0001
  grad_clip_norm: 5.0
  optimizer: adamw
  use_class_weights: true
  mixed_precision: false
  monitor_metric: val_uar
  tensorboard: false
  scheduler:
    name: none

augmentation:
  time_shift_p: 0.0
  time_shift_max: 0
  random_gain_p: 0.0
  random_gain_db: 0.0
  noise_p: 0.0
  noise_std: 0.0
  pitch_shift_p: 0.0
  pitch_shift_max: 0
  time_stretch_p: 0.0
  time_stretch_range: [1.0, 1.0]
  spec_augment_p: 0.0
  time_mask_p: 0.0
  time_mask_max: 0
  freq_mask_p: 0.0
  freq_mask_max: 0
  n_time_masks: 0
  n_freq_masks: 0

model:
  in_channels: 1
  channels: [32, 64, 128]
  dropout: 0.3
  lstm_hidden: 128
  lstm_layers: 1
  n_mels: 64
  n_frames: 188

paths:
  ravdess: "data/raw/ravdess"
  cremad: "data/raw/cremad"
  tess: "data/raw/tess"
  savee: "data/raw/savee"
  processed_manifest: ".ci_fixtures/manifest.csv"
  features_dir: ".ci_fixtures/features"
  splits_dir: ".ci_fixtures/splits"
  results_dir: ".ci_fixtures/results"
  checkpoints_dir: ".ci_fixtures/checkpoints"
  plots_dir: ".ci_fixtures/plots"
  reports_dir: ".ci_fixtures/reports"
  outputs_dir: ".ci_fixtures/runs"
  tensorboard_dir: ".ci_fixtures/tensorboard"
